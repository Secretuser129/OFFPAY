name: offpay   # <-- this is the package name

description: Offline Bluetooth Payments
publish_to: 'none'

version: 2.0.0-alpha+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_blue_plus: ^2.0.2  # (or the latest version)
  provider: ^6.0.5
  shared_preferences: ^2.0.15
  uuid: ^4.5.2
  permission_handler: ^12.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.0
  image_picker: ^1.2.1
  url_launcher: ^6.2.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: 5.13.0
  build_runner: 2.3.3
  hive_generator: 2.0.1

    # ---------------------------------------------
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/bluetooth_black.png